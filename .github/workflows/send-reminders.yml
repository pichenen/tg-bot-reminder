
name: Send Telegram reminders

on:
  schedule:
    - cron: "0 0 * * *"

    - cron: "1 0 * * *"

  workflow_dispatch:

jobs:
  send-message:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send 19:30 reminder
        if: github.event.schedule == '0 0 * * *'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GROUP_ID: ${{ secrets.GROUP_ID }}
          THREAD_ID: ${{ secrets.THREAD_ID }}
          TIME_LABEL: "19:30"
        run: python send_message.py

      - name: Send 20:00 reminder
        if: github.event.schedule == '1 0 * * *'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GROUP_ID: ${{ secrets.GROUP_ID }}
          THREAD_ID: ${{ secrets.THREAD_ID }}
          TIME_LABEL: "20:00"
        run: python send_message.py

      - name: Manual test
        if: github.event_name == 'workflow_dispatch'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GROUP_ID: ${{ secrets.GROUP_ID }}
          THREAD_ID: ${{ secrets.THREAD_ID }}
          TIME_LABEL: "test"
        run: python send_message.py
